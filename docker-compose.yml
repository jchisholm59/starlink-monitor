# docker compose up -d --build   (data/ keeps the 7-day samples, outages and reboots)
services:
  starlink-monitor:
    build: .
    container_name: starlink-monitor
    restart: unless-stopped
    ports: ["7000:7000"]
    environment:
      DISH: 192.168.100.1:9200
      ROUTER: 192.168.1.1:9000
    volumes: ["./data:/app/data"]
